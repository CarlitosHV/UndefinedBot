server:
  port: 2333
  address: 0.0.0.0

lavalink:
  server:
    password: "youshallnotpass"
    sources:
      youtube: false
      http: true
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      nico: true
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true
    youtube:
      clients:
        - "WEB"
        - "ANDROID"
      oauth:
        refreshToken: "${YOUTUBE_REFRESH_TOKEN}"
  plugins:
    - name: "youtube"
      dependency: "dev.lavalink.youtube:youtube-plugin:1.17.0"

    - name: "lavasrc"
      dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.0.0"
      repository: "https://maven.topi.wtf/releases"

    - name: "lavasearch"
      dependency: "com.github.topi314.lavasearch:lavasearch-plugin:1.0.0"
      repository: "https://maven.topi.wtf/releases"

plugins:
  directory: "/plugins"

lavasrc:
  sources:
    spotify: true

  spotify:
    clientId: "${SPOTIFY_CLIENT_ID}"
    clientSecret: "${SPOTIFY_CLIENT_SECRET}"
    countryCode: "MX"
    playlistLoadLimit: 3
    albumLoadLimit: 6
    providers:
      spotify: "cache|http"

logging:
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube: INFO
  request:
    enabled: true
    includeClientInfo: true
    includeHeaders: false
    includeQueryString: true
    includePayload: true
    maxPayloadLength: 10000
  logback:
    rollingpolicy:
      max-file-size: 1GB
      max-history: 30
