server:
  port: 2333
  address: 0.0.0.0

lavalink:
  server:
    password: "youshallnotpass"
    sources:
      youtube: false
      http: true
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      nico: true
      local: false
    bufferDurationMs: 2000
    frameBufferDurationMs: 20000
    opusEncodingQuality: 10
    resamplingQuality: HIGH
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 3
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true
    youtube:
      clients:
        - "ANDROID_TESTSUITE"
        - "ANDROID"
        - "WEB"
      oauth:
        enabled: true
        clientId: "${GOOGLE_CLIENT_ID}"
        clientSecret: "${GOOGLE_SECRET_ID}"
        refreshToken: "${YOUTUBE_REFRESH_TOKEN}"
        skipInitialization: false
  plugins:
    - name: "youtube"
      dependency: "dev.lavalink.youtube:youtube-plugin:1.17.0"

    - name: "lavasrc"
      dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.0.0-beta.7"
      repository: "https://maven.topi.wtf/releases"

    - name: "lavasearch"
      dependency: "com.github.topi314.lavasearch:lavasearch-plugin:1.0.0-beta.2"
      repository: "https://maven.topi.wtf/releases"

plugins:
  directory: "/plugins"
  lavasrc:
    providers:
      - "ytsearch:\"%ISRC%\""
      - "ytmsearch:%QUERY%"
      - "ytsearch:%QUERY%"
      - "scsearch:%QUERY%"
    sources:
      spotify: true
      soundcloud: true
    spotify:
      clientId: "${SPOTIFY_CLIENT_ID}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET}"
      countryCode: "MX"
      playlistLoadLimit: 3
      albumLoadLimit: 6

logging:
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube: INFO
  request:
    enabled: true
    includeClientInfo: true
    includeHeaders: false
    includeQueryString: true
    includePayload: true
    maxPayloadLength: 10000
  logback:
    rollingpolicy:
      max-file-size: 1GB
      max-history: 30
