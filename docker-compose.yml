services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4-alpine
    container_name: lavalink
    hostname: lavalink
    volumes:
      - ./lavalink-config:/opt/Lavalink/config
    environment:
      - _JAVA_OPTIONS=-Xmx8G -Xms4G -XX:+UseG1GC -XX:MaxGCPauseMillis=200
      - PO_TOKEN=${PO_TOKEN}
      - VISITOR_DATA=${VISITOR_DATA}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
    restart: unless-stopped
    depends_on:
      proxy:
        condition: service_started
    networks:
      - undefined-bot
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider --header='Authorization: youshallnotpass' http://localhost:2333/version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  proxy:
    image: ubuntu/squid
    container_name: lavalink-proxy
    restart: unless-stopped
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
    networks:
      - undefined-bot

    pot-generator:
      image: quay.io/invidious/youtube-trusted-session-generator
      container_name: pot-generator
      network_mode: bridge
      environment:
        - CHROMIUM_FLAGS=--no-sandbox

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: undefined-bot
    hostname: undefined-bot
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - COMMAND_PREFIX=${COMMAND_PREFIX:-u$}
      - TIMEOUT_MINUTES=${TIMEOUT_MINUTES:-2}
      - LAVALINK_HOST=lavalink
      - LAVALINK_PORT=2333
      - LAVALINK_PASSWORD=youshallnotpass
      - ADDRESS=${ADDRESS}
    restart: unless-stopped
    depends_on:
      lavalink:
        condition: service_healthy
    networks:
      - undefined-bot

networks:
  undefined-bot:
    driver: bridge
